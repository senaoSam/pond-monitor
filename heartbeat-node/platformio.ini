; Heartbeat node: one image for every A01.. / B01.. power-watching board.
; Board identity comes from RTDB /registry/<MAC> (tools/register.sh), not
; from the build, so the same .bin goes on every board.
;
; dio, not qio: the watchdog board misread flash under qio (32-byte boundary
; wrap, see the handoff), and checking every board of a bulk order for that is
; not practical. dio is slower and a heartbeat does not care.
;
; 4MB layout (two 1.25MB app slots) on purpose, whatever the board carries: it
; installs, and updates over the air, on 4, 8 or 16MB parts alike, so a bulk
; order of a different flash size needs no second build. The image is ~1MB.
; PSRAM is not declared: nothing here uses it.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_extra_dirs = ../shared
lib_deps =

[env:esp32-s3-devkitc-1]
