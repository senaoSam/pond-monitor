; ESP32-B : watchdog. Lives at home, watches the pond node over RTDB.
; Board: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)
;
; Two environments, same firmware:
;   esp32-s3-devkitc-1  USB flashing -- needs the manual BOOT+RST dance on
;                       this board, so it is only for first flash / recovery
;   ota                 wireless flashing over WiFi, no button presses

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash + 8MB octal PSRAM. default_16MB.csv already provides
; app0/app1, so OTA needs no partition change.
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_deps =

[env:esp32-s3-devkitc-1]
; USB. Requires BOOT+RST by hand: this board's CH343 has no auto-reset wiring.

[env:ota]
upload_protocol = espota
upload_port = watchdog.local
; Must match OTA_PASSWORD in secrets.h.
upload_flags = --auth=pond-ota
