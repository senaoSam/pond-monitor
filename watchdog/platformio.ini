; ESP32-B : watchdog. Lives at home, watches the pond node over RTDB.
; Board: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)
;
; Two environments, same firmware:
;   esp32-s3-devkitc-1  USB flashing -- needs the manual BOOT+RST dance on
;                       this board, so it is only for first flash / recovery
;   ota                 wireless flashing over WiFi, no button presses

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM is deliberately NOT declared here, even though this board has it.
;
; eFuse confirms the hardware: PSRAM_CAP = 8M, PSRAM_VENDOR = AP_3v3,
; FLASH_TYPE = 4 data lines. But under this Arduino version PSRAM fails to
; initialise on this board either way -- ESP.getPsramSize() returns 0 with
; psram_type set to `opi` and to `qio` alike. Declaring -DBOARD_HAS_PSRAM on
; top of a failed init is pointless, so it stays off -- but note it is NOT the
; cause of this board's OTA failure, despite what this comment used to say.
;
; Measured, in this order: opi+HAS_PSRAM -> OTA fails; qio+HAS_PSRAM -> OTA
; fails; neither -> OTA still fails on this board (v10 -> v11, twice, in
; /fwlog/watchdog). An earlier revision of this comment claimed "neither"
; succeeded; that was wrong, and it is why the OTA hunt kept circling back to
; PSRAM. The watchdog's OTA failure is unexplained and PSRAM is not the lead.
;
; No functional loss: this firmware peaks around 60KB of the 320KB internal
; heap. Revisit only if a future feature actually needs the 8MB.
board_build.flash_mode = qio
; The "match the sensor node's PSRAM declaration" experiment is settled: it is
; not the cause. /fwlog/watchdog holds two v10 -> v11 attempts that failed with
; the same ESP_ERR_OTA_VALIDATE_FAILED, and v10 was built with no PSRAM
; declaration at all. Both states of this variable have now failed on this
; board, so it is not what distinguishes it from the sensor node. Left off.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_extra_dirs = ../shared
lib_deps =

[env:esp32-s3-devkitc-1]
; USB. Requires BOOT+RST by hand: this board's CH343 has no auto-reset wiring.

[env:ota]
upload_protocol = espota
upload_port = watchdog.local
; Must match OTA_PASSWORD in secrets.h.
upload_flags = --auth=pond-ota
