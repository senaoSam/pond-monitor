; ESP32-B : watchdog. Lives at home, watches the pond node over RTDB.
; Board: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)
;
; Two environments, same firmware:
;   esp32-s3-devkitc-1  USB flashing -- needs the manual BOOT+RST dance on
;                       this board, so it is only for first flash / recovery
;   ota                 wireless flashing over WiFi, no button presses

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM is deliberately NOT declared here, even though this board has it.
;
; eFuse confirms the hardware: PSRAM_CAP = 8M, PSRAM_VENDOR = AP_3v3,
; FLASH_TYPE = 4 data lines. But under this Arduino version PSRAM fails to
; initialise on this board either way -- ESP.getPsramSize() returns 0 with
; psram_type set to `opi` and to `qio` alike. Declaring -DBOARD_HAS_PSRAM on
; top of a failed init is what breaks OTA: uploads complete, then fail at
; activate with "Could Not Activate The Firmware". USB flashing and normal
; operation are unaffected, which makes it hard to attribute.
;
; Measured, in this order: opi+HAS_PSRAM -> OTA fails; qio+HAS_PSRAM -> OTA
; fails; neither -> OTA succeeds in both directions.
;
; No functional loss: this firmware peaks around 60KB of the 320KB internal
; heap. Revisit only if a future feature actually needs the 8MB.
board_build.flash_mode = qio
; Matches the sensor node, whose pull-based OTA works. Both boards' eFuse
; reports 8MB AP_3v3 PSRAM, and the one difference between a board whose OTA
; validates and one whose does not was this declaration -- so make them the
; same and let the result decide.
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_extra_dirs = ../shared
lib_deps =

[env:esp32-s3-devkitc-1]
; USB. Requires BOOT+RST by hand: this board's CH343 has no auto-reset wiring.

[env:ota]
upload_protocol = espota
upload_port = watchdog.local
; Must match OTA_PASSWORD in secrets.h.
upload_flags = --auth=pond-ota
