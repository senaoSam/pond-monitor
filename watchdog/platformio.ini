; ESP32-B : watchdog. Lives at home, watches the pond node over RTDB.
; Board: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)
;
; Two environments, same firmware:
;   esp32-s3-devkitc-1  USB flashing over the CH343 port. esptool's automatic
;                       reset works on this board (measured 2026-09-01; the
;                       "needs manual BOOT+RST" note was wrong) -- but note
;                       that merely opening the CH343 serial port resets the
;                       board, so don't open it casually on a deployed device
;   ota                 wireless flashing over WiFi, no button presses

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM is deliberately NOT declared here, even though this board has it.
;
; eFuse confirms the hardware: PSRAM_CAP = 8M, PSRAM_VENDOR = AP_3v3,
; FLASH_TYPE = 4 data lines. But under this Arduino version PSRAM fails to
; initialise on this board either way -- ESP.getPsramSize() returns 0 with
; psram_type set to `opi` and to `qio` alike. Declaring -DBOARD_HAS_PSRAM on
; top of a failed init is pointless, so it stays off -- but note it is NOT the
; cause of this board's OTA failure, despite what this comment used to say.
;
; PSRAM was chased for a while as the OTA suspect; it never was (the real
; cause is the flash_mode note below). That it fails to initialise on this
; board while the sensor node's does is still unexplained, but nothing here
; needs the 8MB, so it stays off. Revisit only if a feature wants it.
;
; No functional loss: this firmware peaks around 60KB of the 320KB internal
; heap.

; dio, NOT qio -- this is the fix for this board's OTA failure, found
; 2026-09-01 after seven wrong theories. Measured with /rawprobe (v31-v35):
; under qio, any SPI1 read that crosses a 32-byte boundary comes back wrapped
; to the boundary (large reads: each 64-byte transaction holds the first 32
; bytes twice). esp_image_verify() reads segment headers at arbitrary offsets
; over exactly that path, so every OTA activation failed with
; ESP_ERR_OTA_VALIDATE_FAILED even though the written image was byte-perfect
; (dumps matched the release, all 977152 bytes). The cache (SPI0) fills
; 32-byte-aligned lines and never crosses a boundary, which is why the board
; always booted and mmap reads were always correct; esptool reads with a
; different command, which is why dumps were always correct; NVS entries are
; 32-byte aligned, which is why NVS never corrupted. Under dio the same
; reads are correct everywhere (raw == mmap == release SHA over the full
; image, esp_image_verify == ESP_OK on the very slot that used to fail).
;
; The sensor node's chip is the same model (c2 2018) and is fine under qio,
; so this is a per-chip (or per-board quad-wiring) defect. When buying more
; boards: flash the diagnostic firmware and hit /rawprobe with a crossing
; read before trusting qio on a new unit.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_extra_dirs = ../shared
lib_deps =

[env:esp32-s3-devkitc-1]
; USB. Requires BOOT+RST by hand: this board's CH343 has no auto-reset wiring.

[env:ota]
upload_protocol = espota
upload_port = watchdog.local
; Must match OTA_PASSWORD in secrets.h.
upload_flags = --auth=pond-ota
