; ESP32-A : QX-DT01P (RS485/Modbus) -> Firebase RTDB
; Board: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM)

; Two environments, same firmware:
;   esp32-s3-devkitc-1  USB flashing -- needs the manual BOOT+RST dance on
;                       this board, so it is only for first flash / recovery
;   ota                 wireless flashing over WiFi, no button presses
; default_16MB.csv already provides app0/app1, so OTA needs no partition
; change. `pio run -e ota -t upload` is the everyday path.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash + 8MB octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Serial goes to the native-USB CDC. The board's CH343 is not on UART0's
; default pins, so CDC is the reliable path for console output.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; Modbus RTU is framed by hand in main.cpp -- see the note there on why
; ModbusMaster's fixed 2s timeout is unusable for a brute-force sweep.
lib_extra_dirs = ../shared
lib_deps =

[env:esp32-s3-devkitc-1]
; USB. Requires BOOT+RST by hand: this board's CH343 has no auto-reset wiring.

[env:ota]
upload_protocol = espota
upload_port = pond-site.local
; Must match OTA_PASSWORD in secrets.h.
upload_flags = --auth=pond-ota
