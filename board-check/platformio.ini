; Board verifier. Flash to a new ESP32-S3 to read its real specs before
; writing any project config for it -- silkscreen labels are not reliable.
;
; Deliberately declares NO PSRAM: declaring PSRAM that isn't present breaks
; OTA in a way that is nearly invisible (see README), so this build must be
; safe to flash to an unknown board.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
